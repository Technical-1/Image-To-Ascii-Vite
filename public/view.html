<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shared ASCII Art - View this amazing ASCII creation">
  <title>Shared ASCII Art - Image to ASCII Converter</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="shortcut icon" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
  
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #2d2d2d;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --accent-primary: #00ff00;
      --accent-dim: #00cc00;
      --border-color: #333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, #001a00 100%);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 1.3rem;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-dim));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .create-btn {
      background: var(--accent-primary);
      color: var(--bg-primary);
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .create-btn:hover {
      background: var(--accent-dim);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(0, 255, 0, 0.3);
    }

    /* Main Content - ASCII fills remaining space */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
    }

    .ascii-container {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      overflow: auto;
      max-height: 100%;
      max-width: 100%;
      font-family: 'Courier New', monospace;
      font-size: 8px;
      line-height: 0.7;
      color: var(--accent-primary);
      white-space: pre;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .ascii-container::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .ascii-container::-webkit-scrollbar-track {
      background: var(--bg-secondary);
      border-radius: 4px;
    }

    .ascii-container::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    /* Floating Download Bar */
    .floating-bar {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(26, 26, 26, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    .floating-bar.hidden {
      display: none;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .action-btn:hover {
      background: var(--accent-primary);
      color: var(--bg-primary);
      border-color: var(--accent-primary);
      transform: translateY(-2px);
    }

    .action-btn .icon {
      font-size: 1.1rem;
    }

    /* Loading & Error States */
    .loading, .error {
      text-align: center;
      padding: 100px 20px;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(0, 255, 0, 0.1);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error h2 {
      color: #ff4444;
      margin-bottom: 15px;
    }

    .error p {
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--bg-secondary);
      border: 1px solid var(--accent-primary);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.95rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 2000;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Hidden canvas for PNG export */
    #export-canvas {
      display: none;
    }

    /* Stats overlay */
    .stats-overlay {
      position: fixed;
      top: 80px;
      right: 20px;
      display: flex;
      gap: 15px;
      padding: 10px 15px;
      background: rgba(26, 26, 26, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.85rem;
      z-index: 100;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
    }

    .stat-value {
      color: var(--accent-primary);
      font-weight: 600;
      font-family: monospace;
    }

    @media (max-width: 768px) {
      .header {
        padding: 12px 15px;
      }

      .header h1 {
        font-size: 1rem;
      }

      .create-btn {
        padding: 8px 14px;
        font-size: 0.8rem;
      }

      .main {
        padding: 15px;
      }

      .ascii-container {
        font-size: 4px;
        padding: 15px;
      }

      .floating-bar {
        bottom: 20px;
        padding: 10px 12px;
        gap: 6px;
      }

      .action-btn {
        padding: 8px 12px;
        font-size: 0.8rem;
      }

      .action-btn .label {
        display: none;
      }

      .stats-overlay {
        top: 70px;
        right: 10px;
        padding: 8px 12px;
        font-size: 0.75rem;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>🖼️ Shared ASCII Art</h1>
    <a href="/" class="create-btn">✨ Create Your Own</a>
  </header>

  <main class="main">
    <div id="content">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading ASCII art...</p>
      </div>
    </div>
  </main>

  <div class="stats-overlay hidden" id="stats"></div>

  <div class="floating-bar hidden" id="floating-bar">
    <button class="action-btn" id="btn-copy" type="button">
      <span class="icon">📋</span>
      <span class="label">Copy</span>
    </button>
    <button class="action-btn" id="btn-txt" type="button">
      <span class="icon">📄</span>
      <span class="label">TXT</span>
    </button>
    <button class="action-btn" id="btn-png" type="button">
      <span class="icon">🖼️</span>
      <span class="label">PNG</span>
    </button>
    <button class="action-btn" id="btn-html" type="button">
      <span class="icon">🎨</span>
      <span class="label">HTML</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>
  <canvas id="export-canvas"></canvas>

  <!-- External scripts only: CSP forbids inline <script> and inline on* handlers.
       Both use `defer` so DOMPurify is defined before viewer.js runs and the DOM is parsed. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js" defer></script>
  <script src="/viewer.js" defer></script>
</body>
</html>
